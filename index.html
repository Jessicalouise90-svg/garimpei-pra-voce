<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d6b4f">
  <title>Garimpei pra Você</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo-mark">G</div>
      <div>
        <h1>Garimpei pra Você</h1>
        <p>Crie sua oferta em poucos segundos ✨</p>
      </div>
    </header>

    <section class="card">
      <h2>🛍️ Sua oferta</h2>

      <label class="photo-box">
        <input id="photo" type="file" accept="image/*">
        <span id="photoText">📷 Toque para escolher a foto</span>
        <img id="photoPreview" alt="">
      </label>

      <label>Nome do produto
        <input id="name" type="text" placeholder="Ex.: Air Fryer 5L">
      </label>

      <label>Link do produto
        <input id="link" type="url" inputmode="url" placeholder="Cole o link aqui">
      </label>

      <div class="grid">
        <label>Preço atual *
          <input id="price" type="text" inputmode="decimal" placeholder="R$ 79,90">
        </label>
        <label>Preço anterior <small>(opcional)</small>
          <input id="oldPrice" type="text" inputmode="decimal" placeholder="R$ 99,90">
        </label>
      </div>

      <div class="optional">
        <h3>✨ Extras — opcionais</h3>

        <label class="toggle">
          <input id="couponOn" type="checkbox">
          <span>🎟️ Adicionar cupom</span>
        </label>
        <input id="coupon" class="extra" type="text" placeholder="Código do cupom" disabled>

        <label class="toggle">
          <input id="pixOn" type="checkbox">
          <span>💳 Adicionar preço no PIX</span>
        </label>
        <input id="pix" class="extra" type="text" inputmode="decimal" placeholder="R$ 74,90" disabled>
      </div>

      <button id="generate" class="primary">GERAR PRÉVIA ✨</button>
      <p id="error" class="error"></p>
    </section>

    <section class="preview-card">
      <div class="preview-head">
        <h2>Prévia</h2>
        <span>1080 × 1080</span>
      </div>

      <div id="art" class="art">
        <div class="art-top">ACHADINHO DO DIA 🛍️</div>
        <div class="image-wrap"><img id="artImage" alt=""></div>
        <div class="art-content">
          <div id="artName" class="art-name">Seu produto aparecerá aqui</div>
          <div id="prices" class="prices"></div>
          <div id="extras"></div>
          <div class="cta">VER OFERTA →</div>
          <div class="brand">Garimpei pra Você</div>
        </div>
      </div>

      <button id="download" class="secondary">⬇️ BAIXAR ARTE</button>
      <p class="hint">A imagem é criada no próprio celular. Seu link não é enviado para nenhum servidor.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
